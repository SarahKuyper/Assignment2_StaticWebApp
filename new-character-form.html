<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Character Form</title>
</head>

<body>
    <div class="grid">
        <style>
            body {
                font-family: Trebuchet MS, Arial, sans-serif;
                margin: 0px;
                padding: 5px;
                background-color: #7692ff;
                color: #ffffff;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                padding: 10px;
                place-items: center;
            }

            .grid {
                max-width: 100%;
                height: auto;
                border-radius: 10px;
                border: 2px solid #091540;
                background-color: #abd2fa;
            }

            form {
                display: flex;
                flex-direction: column;
                font-family: Trebuchet MS, Arial, sans-serif;
            }

            footer {
                background-color: #091540;
                color: #e5fcff;
                text-align: center;
                padding: 10px;
                border-radius: 10px;
                border: 2px solid #091540;
            }
        </style>
        <div><a href="about.html">About the Site</a></div>
        <div><a href="index.html">Character Index</a></div>
        <div><a href="details.html">Character Details</a></div>
        <div><a href="new-character-form.html">Character Creation</a></div>
    </div>
    </div>
    <header>
        <h1>Create a Character</h1>
        <form>
            <input type="text" id="text" name="text" placeholder="Provide a link to an image of your character">
            <input type="text" id="name" name="name" placeholder="What is the name of your character?">
            <input type="text" id="species" name="species" placeholder="What is their species?">
            <input type="text" id="occupancy" name="occupancy" placeholder="What is their story role or occupancy?">
            <input type="text" id="abilities" name="abilities" placeholder="Any abilities?">
            <textarea id="backstory" name="backstory" placeholder="What is their backstory?"></textarea>
            <textarea id="interests" name="interests" placeholder="What're their interests?"></textarea>
            <button>Create your character!</button>

            <style>
                button {
                    background-color: #1b2cc1;
                    color: #ffffff;
                    padding: 5px 10px;
                    border: none;
                    cursor: pointer;
                    margin-bottom: 10px;
                    border-radius: 10px;
                border: 2px solid #091540;
                }

                button:hover {
                    background-color: #091540;
                }

                header {
                    color: #e5fcff;
                    margin-left: 10px;
                }

                input[type=text] {
                    padding: 5px;
                    margin-bottom: 10px;
                    width: 98%;
                    background-color: #abd2fa;
                    font-family: Trebuchet MS, Arial, sans-serif;
                    border: 2px solid #091540;
                    border-radius: 10px;
                }

                textarea {
                    padding: 5px;
                    margin-bottom: 10px;
                    width: 98%;
                    height: 100px;
                    border-radius: 10px;
                    border: 2px solid #091540;
                    background-color: #abd2fa;
                    font-family: Trebuchet MS, Arial, sans-serif;
                }
            </style>
        </form>

        <footer id="footer">
            <p>&copy; 2023 My Website. All rights reserved.</p>
        </footer>
</body>

</html>
