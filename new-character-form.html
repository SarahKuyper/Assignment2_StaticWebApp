<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Character Form</title>
</head>

<body>
    <header>
        <h1>Create a Character</h1>
    <form>
        <input type="img" id="image" name="image" placeholder="Provide a link to an image of your character">
        <input type="text" id="name" name="name" placeholder="What is the name of your character?">
        <input type="text" id="species" name="species" placeholder="What is their species?">
        <input type="text" id="abilities" name="abilities" placeholder="Any abilities?">
        <textarea id="backstory" name="backstory" placeholder="What is their backstory?"></textarea>
        <textarea id="interests" name="interests" placeholder="What're their interests?"></textarea>
        <button>Create your character!</button>

        <style>
            button {
                background-color: #4CAF50;
                color: white;
                padding: 5px 10px;
                border: none;
                cursor: pointer;
                margin-bottom: 10px;
            }

            button:hover {
                background-color: #45a049;
            }

            input[type=img] {
                padding: 5px;
                margin-bottom: 10px;
                width: 90%;
            }

            input[type=text] {
                padding: 5px;
                margin-bottom: 10px;
                width: 90%;
            }

            textarea {
                padding: 5px;
                margin-bottom: 10px;
                width: 90%;
                height: 100px;
            }
        </style>
    </form>
</body>

</html>
